<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::div})}">
<div>
    <h3 class="fw-bold mb-4">Browse Active Opportunities</h3>
    <div class="row g-3">
        <div th:each="job : ${jobsPage.content}" class="col-12">
            <div class="card card-custom p-4">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h4 class="fw-bold mb-1" th:text="${job.title}">Title</h4>
                        <div class="text-muted mb-2">
                            <span th:text="${job.company}"></span> &bull; <span th:text="${job.location}"></span> &bull;
                            <span class="badge bg-light text-dark border" th:text="${job.jobType}"></span>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/candidate/match-analysis/{id}(id=${job.id})}" class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-graph-up-arrow me-1"></i>Fit Match
                        </a>
                        <a th:href="@{/jobs/view/{id}(id=${job.id})}" class="btn btn-primary btn-sm">Details</a>
                    </div>
                </div>
                <div class="mt-2">
                    <span th:each="s : ${#strings.arraySplit(job.requiredSkills, ',')}" class="badge-skill" th:text="${#strings.trim(s)}"></span>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
