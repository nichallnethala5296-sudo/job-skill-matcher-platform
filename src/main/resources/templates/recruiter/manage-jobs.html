<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::div})}">
<div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Manage Posted Jobs</h3>
        <a th:href="@{/recruiter/jobs/new}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>New Job</a>
    </div>
    <div class="card card-custom p-3">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>Title</th>
                    <th>Company</th>
                    <th>Location</th>
                    <th>Required Skills</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="j : ${jobs}">
                    <td class="fw-bold" th:text="${j.title}"></td>
                    <td th:text="${j.company}"></td>
                    <td th:text="${j.location}"></td>
                    <td><small th:text="${j.requiredSkills}"></small></td>
                    <td>
                        <a th:href="@{/recruiter/jobs/edit/{id}(id=${j.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</html>
