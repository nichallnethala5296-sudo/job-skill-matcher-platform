<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::div})}">
<div>
    <h3 class="fw-bold mb-4">Candidate Search Directory</h3>
    <div class="row g-3">
        <div th:each="c : ${candidates}" class="col-md-6">
            <div class="card card-custom p-4">
                <h5 class="fw-bold mb-1" th:text="${c.user.name}">Candidate Name</h5>
                <span class="text-muted small" th:text="${c.user.email}"></span>
                <p class="mt-2 mb-1" th:text="${c.headline}">Headline</p>
                <span class="badge bg-light text-dark border align-self-start" th:text="${c.experienceLevel}"></span>
            </div>
        </div>
    </div>
</div>
</html>
