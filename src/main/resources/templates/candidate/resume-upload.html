<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::div})}">
<div>
    <h3 class="fw-bold mb-4">Resume Parsing & Skills Profile</h3>
    <div class="row g-4">
        <div class="col-md-5">
            <div class="card card-custom p-4">
                <h5 class="fw-bold mb-3">Upload Resume</h5>
                <form th:action="@{/candidate/resume-upload}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input type="file" name="resumeFile" class="form-control" accept=".pdf,.docx" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Upload & Parse Skills</button>
                </form>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card card-custom p-4">
                <h5 class="fw-bold mb-3">Extracted Skills</h5>
                <div th:if="${#lists.isEmpty(skills)}" class="text-muted">No skills parsed yet. Upload your PDF or DOCX resume.</div>
                <div th:unless="${#lists.isEmpty(skills)}" class="d-flex flex-wrap gap-1">
                    <span th:each="cs : ${skills}" class="badge-skill" th:text="${cs.skill.normalizedName}">JAVA</span>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
