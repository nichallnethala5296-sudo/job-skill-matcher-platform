<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::div})}">
<div>
    <h3 class="fw-bold mb-4">Candidate Dashboard</h3>
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card card-custom p-3 border-start border-4 border-primary">
                <h6>Verified Skills</h6>
                <h3 class="fw-bold" th:text="${#lists.size(skills)}">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-custom p-3 border-start border-4 border-success">
                <h6>Applications</h6>
                <h3 class="fw-bold" th:text="${applicationsCount}">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-custom p-3 border-start border-4 border-warning">
                <h6>Saved Jobs</h6>
                <h3 class="fw-bold" th:text="${savedCount}">0</h3>
            </div>
        </div>
    </div>
    <div class="d-flex gap-2">
        <a th:href="@{/candidate/resume-upload}" class="btn btn-primary"><i class="bi bi-file-earmark-arrow-up me-1"></i>Manage Resume</a>
        <a th:href="@{/jobs}" class="btn btn-outline-dark"><i class="bi bi-briefcase me-1"></i>Explore Jobs</a>
    </div>
</div>
</html>
