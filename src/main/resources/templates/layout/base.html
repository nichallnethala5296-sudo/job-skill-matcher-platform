<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Skill Matcher & AI Gap Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" th:href="@{/}">
                <i class="bi bi-bullseye text-primary me-2"></i>SkillMatch AI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/jobs}">Browse Jobs</a></li>
                    <li class="nav-item" sec:authorize="hasRole('CANDIDATE')"><a class="nav-link" th:href="@{/candidate/dashboard}">Dashboard</a></li>
                    <li class="nav-item" sec:authorize="hasRole('CANDIDATE')"><a class="nav-link" th:href="@{/candidate/resume-upload}">Resume & Skills</a></li>
                    <li class="nav-item" sec:authorize="hasRole('CANDIDATE')"><a class="nav-link" th:href="@{/candidate/saved-jobs}">Saved Jobs</a></li>
                    <li class="nav-item" sec:authorize="hasRole('CANDIDATE')"><a class="nav-link" th:href="@{/candidate/applications}">Applications</a></li>
                    <li class="nav-item" sec:authorize="hasRole('RECRUITER')"><a class="nav-link" th:href="@{/recruiter/dashboard}">Recruiter Hub</a></li>
                    <li class="nav-item" sec:authorize="hasRole('RECRUITER')"><a class="nav-link" th:href="@{/recruiter/manage-jobs}">Manage Jobs</a></li>
                    <li class="nav-item" sec:authorize="hasRole('RECRUITER')"><a class="nav-link" th:href="@{/recruiter/candidates}">Candidates</a></li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/dashboard}">Admin</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="btn btn-outline-light btn-sm me-2" th:href="@{/login}">Login</a></li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="btn btn-primary btn-sm" th:href="@{/register}">Sign Up</a></li>
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle text-light" href="#" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i> <span sec:authentication="name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <form th:action="@{/logout}" method="post" class="px-2 py-1">
                                    <button type="submit" class="dropdown-item text-danger">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:replace="${content}"></div>
    </main>

    <footer class="bg-white border-top py-3 mt-auto text-center text-muted small">
        <div class="container">&copy; SkillMatch AI &bull; Deterministic Skill Gap Analysis Engine &bull; Spring Boot 3.3.4</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
